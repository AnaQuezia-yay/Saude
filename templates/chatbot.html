<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chat.css">

  <title>SaúdeBot - Triagem</title>
</head>
<body>
  <div class="app-container">
    <header class="chat-header">
      <h2>SaúdeBot</h2>
    </header>

    <!-- Área onde as mensagens aparecem -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot">
        <div class="avatar">🤖</div>
        <div class="bubble">Olá! Sou o SaúdeBot e ajudo com dúvidas quanto à classificação de sintomas.</div>
      </div>
      <div class="message bot">
        <div class="avatar">🤖</div>
        <div class="bubble">Me diga o que você está sentindo para que eu possa te ajudar.</div>
      </div>
    </div>

    <!-- Campo de digitação -->
    <div class="chat-input-area">
      <input type="text" id="userInput" placeholder="Digite seu sintoma..." autocomplete="off">
      <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <!-- Lógica do JavaScript integrada -->
  <script>
    async function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      
      if (text === "") return;

      // 1. Mostra a mensagem do usuário na tela
      appendMessage("user", text);
      input.value = "";

      try {
        // 2. Envia para o Python processar
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mensagem: text })
        });

        const data = await response.json();

        // 3. Mostra a resposta que veio do servidor Python
        setTimeout(() => {
          appendMessage("bot", data.resposta);
        }, 500);

      } catch (error) {
        console.error("Erro ao comunicar com o servidor:", error);
      }
    }

    function appendMessage(sender, text) {
      const container = document.getElementById("chatMessages");

      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message", sender);

      const avatarDiv = document.createElement("div");
      avatarDiv.classList.add("avatar");
      if (sender === "user") avatarDiv.classList.add("user-avatar");
      avatarDiv.textContent = sender === "bot" ? "🤖" : "👤";

      const bubbleDiv = document.createElement("div");
      bubbleDiv.classList.add("bubble");
      bubbleDiv.innerHTML = text;

      messageDiv.appendChild(avatarDiv);
      messageDiv.appendChild(bubbleDiv);
      container.appendChild(messageDiv);

      container.scrollTop = container.scrollHeight;
    }

    // Envia ao pressionar Enter
    document.getElementById("userInput").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
